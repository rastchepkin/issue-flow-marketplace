name: Bug report
description: Something is not working
title: "[bug] "
labels: ["type:bug"]
body:
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      value: |
        1.
        2.
        3.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: env
    attributes:
      label: Environment
      description: Python, Django, Node, OS, prod/local
  - type: textarea
    id: ac
    attributes:
      label: Acceptance criteria
      value: |
        - [ ] AC-1: following Steps to reproduce now gives Expected behavior
    validations:
      required: false
  - type: textarea
    id: spec
    attributes:
      label: Verification spec
      description: What the fix could break nearby (RISK-*), exact boundaries (EDGE-*), rules that always hold (INV-*).
      value: |
        Risks
        - RISK-1 [high|medium|low]:
        Edge cases
        - EDGE-1:
    validations:
      required: false
